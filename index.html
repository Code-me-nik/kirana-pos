 <label>GSTIN<input name="gstin" lang="und" value="${esc(p.gstin||"")}" placeholder="GST registration number"></label>
 <label>UPI ID<input name="upi" lang="und" value="${esc(p.upi||"")}" placeholder="store@upi"></label>
 <label style="grid-column:1/-1">Store address<textarea name="address" lang="und" rows="2" placeholder="Street, area, city, state, PIN code">${esc(p.address||"")}</textarea></label>
 <label style="grid-column:1/-1">Invoice footer / thank-you note<input name="footer" lang="und" value="${esc(p.footer||"")}" placeholder="Thank you! Visit again."></label>
 <label>Store logo<input name="logo" type="file" accept="image/*"><small class="mu">Selecting a logo opens the crop and rotate editor.</small></label>
 ${logo?`<div><span class="mu">Current logo</span><br><img src="${logo}" alt="Store logo" style="width:76px;height:76px;object-fit:contain;border-radius:10px;background:var(--calc);margin-top:6px"><br><button type="button" class="x" onclick="editStoreLogo()">✂️ Edit crop</button></div>`:""}
 </div><div class="row"><button class="btn">Save store profile</button></div></form>`;
}
async function saveProfile(e){
 e.preventDefault();const f=new FormData(e.target),p={...(db.storeProfile||{})};
 ["name","owner","phone","email","gstin","upi","address","footer"].forEach(k=>p[k]=String(f.get(k)||"").trim());
 const logo=f.get("logo");if(logo&&logo.size){try{p.logoOriginal=await readImageSource(logo);p.logo=await cropImage(p.logoOriginal);if(!p.logo)return false}catch(err){alert("Could not open this image. Please choose another image.");return false}}
 db.storeProfile=p;db.shop=p.name;save();render();return false
}
async function editStoreLogo(){const p=db.storeProfile||{};if(!p.logo)return;const original=p.logoOriginal||p.logo,logo=await cropImage(original);if(logo){p.logo=logo;p.logoOriginal=original;db.storeProfile=p;save();render()}}
function reportsView(){const c=catStats();return`<h2>Reports &amp; Category Performance</h2><div class="card">${table([["Category",r=>esc(r[0])],["Revenue",r=>money(r[1].rev)],["COGS",r=>money(r[1].cogs)],["Gross profit",r=>`<b>${money(r[1].profit)}</b>`],["Margin",r=>(r[1].rev?r[1].profit/r[1].rev*100:0).toFixed(1)+"%"]],Object.entries(c))}</div>
<div class="card"><h3>Shop details</h3><label>Shop name on receipts<input lang="und" value="${esc(db.shop||"")}" placeholder="Kirana Store" onchange="db.shop=this.value.trim();db.storeProfile.name=db.shop;save();render()"></label></div><div class="card"><h3>Data tools</h3><div class="row" style="flex-wrap:wrap"><button class="btn" onclick="exp('sales')">📄 Sales CSV</button><button class="btn" onclick="exp('cust')">📄 Customer balances CSV</button><button class="btn" onclick="exp('json')">💾 Backup JSON</button><button class="btn ghost" onclick="imp()">📥 Import backup</button><button class="btn ghost" onclick="wipe(this)">Clear all data</button></div></div>`}
function wipe(b){if(!b.dataset.s){b.dataset.s=1;b.textContent="Tap again to confirm";return}db={};fix();save();render()}
const csv=a=>a.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
function exp(k){let t,x;if(k=="json"){t="Backup JSON";x=JSON.stringify(db)}else if(k=="sales"){t="Sales CSV";x=csv([["Invoice","Date","Customer","Payment","Subtotal","Discount","GST","Total","Profit"],...db.sales.map(s=>[s.id,s.date,cn(s.cust),s.pay,s.sub,s.disc,s.gst,s.total,profit(s)])])}else{t="Customer balances CSV";x=csv([["ID","Name","Phone","Credit sales","Repaid","Balance"],...db.customers.map(c=>[c.id,c.name,c.phone,ccs(c),crp(c),ccs(c)-crp(c)])])}
 dlg(`<h3>${t}</h3><p class="mu">Copy this text and paste it into a file (${k=="json"?".json":".csv, opens in Excel"}).</p><textarea id="ta" readonly rows="10">${esc(x)}</textarea><div class="row"><button class="btn" onclick="cp()">Copy</button>${cls}</div>`)}
function cp(){const a=$("#ta");a.select();try{navigator.clipboard.writeText(a.value)}catch(e){document.execCommand("copy")}}
function imp(){dlg(`<h3>Import data</h3><p class="mu">Choose a backup file or paste its JSON. This replaces current data.</p><input type="file" accept=".json,application/json" onchange="rd(this)"><textarea id="ta" lang="und" rows="8" placeholder="Paste backup JSON here"></textarea><div class="row"><button class="btn" onclick="doImp()">Restore</button>${cls}</div><p id="im" class="mu"></p>`)}
function rd(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("#ta").value=r.result;r.readAsText(f)}
function doImp(){
 try{
  const imported=parseSavedData($("#ta").value);
  if(!Array.isArray(imported.sales))throw new Error("The backup is missing its sales records.");
  fix(imported);db=imported;save();$("#dlg").close();render()
 }catch(e){$("#im").textContent="Import failed: "+(e.message||"invalid backup")}
}
const NAV=[
 {id:"billing",label:"🧾 Billing & Sales",pages:[["billing","Easy Billing"],["sales","Sales Log"]]},
 {id:"inventory",label:"📦 Inventory",pages:[["products","Product Master"],["adjustments","Stock Adjustments"]]},
 {id:"purchasing",label:"🛒 Purchasing",pages:[["purchases","Purchases Log"],["suppliers","Supplier Payables"],["payments","Payment Vouchers"]]},
 {id:"customers",label:"👥 Customers",pages:[["customers","Customer Ledger"]]},
 {id:"insights",label:"📊 Insights & Expenses",pages:[["dash","Dashboard & Analytics"],["reports","Reports & Categories"],["expenses","Expenses Log"]]},
 {id:"profile",label:"🏪 Store Profile",pages:[["profile","Store Profile"]]}
];
const PAGE_GROUP=Object.fromEntries(NAV.flatMap(group=>group.pages.map(([id])=>[id,group.id])));
const V={billing:billingView,dash:dashView,profile:profileView,reports:reportsView};KS.forEach(k=>{if(T[k])V[k]=()=>logView(k)});
function go(id){const group=NAV.find(n=>n.id==id);if(!group)return;cur=id;page=pageByGroup[cur]||group.pages[0][0];save();render();scrollTo(0,0)}
function showPage(id){if(PAGE_GROUP[id]!=cur)return;page=id;pageByGroup[cur]=id;save();render()}
function toggleMobileMenu(open){
 const menu=$("#mobileMenu"),toggle=$("#mobileMenuToggle"),isOpen=open===undefined?menu.hidden:open;
 menu.hidden=!isOpen;toggle.setAttribute("aria-expanded",String(isOpen));toggle.setAttribute("aria-label",isOpen?"Close navigation menu":"Open navigation menu");
 if(isOpen){const active=menu.querySelector('[aria-current="page"]');(active||menu.querySelector(".mobile-menu-close")).focus()}
 else toggle.focus()
}
function mobileGo(groupId,pageId){
 const group=NAV.find(n=>n.id==groupId);if(!group||!group.pages.some(([id])=>id==pageId))return;
 cur=groupId;page=pageId;pageByGroup[cur]=page;toggleMobileMenu(false);save();render();scrollTo(0,0)
}
document.addEventListener("keydown",event=>{
 if(event.key=="Escape"&&!$("#mobileMenu").hidden){toggleMobileMenu(false);return}
 if(event.key!="Tab"||$("#mobileMenu").hidden)return;
 const menu=$("#mobileMenu"),focusable=[...menu.querySelectorAll("button")],first=focusable[0],last=focusable[focusable.length-1];
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
});
function render(){
 $("#appTitle").textContent="🛒 "+storeName();document.title=storeName()+" · POS";
 $("#nav").innerHTML=NAV.map(n=>`<button class="${n.id==cur?"on":""}" aria-current="${n.id==cur?"page":"false"}" onclick="go('${n.id}')">${n.label}</button>`).join("");
 $("#mobileMenuItems").innerHTML=NAV.map(group=>`<section class="mobile-menu-group"><h3>${group.label}</h3>${group.pages.map(([id,label])=>`<button type="button" aria-current="${id==page?"page":"false"}" onclick="mobileGo('${group.id}','${id}')">${label}</button>`).join("")}</section>`).join("");
 const group=NAV.find(n=>n.id==cur)||NAV[0];
 if(!group.pages.some(([id])=>id==page))page=group.pages[0][0];
 $("#subnav").innerHTML=group.pages.length>1?group.pages.map(([id,label])=>`<button class="${id==page?"on":""}" aria-current="${id==page?"page":"false"}" onclick="showPage('${id}')">${label}</button>`).join(""):"";
 $("#main").innerHTML=V[page]();
 if(page=="billing")drawCart();
 if(page=="dash")drawCharts();
 if(T[page])renderList(page)
}
async function startApp(){
 try{await load()}catch(e){console.error("App startup stopped to protect saved device data",e);storageStatus("Saved data could not be loaded; it was not replaced",true);$("#main").innerHTML='<div class="card"><h2>Saved data needs attention</h2><p>Your device data could not be read safely, so the app did not create demo data or overwrite it.</p><p class="mu">If you have a JSON backup, use Import to restore it. Do not clear this site’s browser data.</p><button class="btn" type="button" onclick="imp()">Import a backup</button></div>';return}
 if(db.ui&&db.ui.listState)Object.assign(listState,db.ui.listState);
 if(db.ui&&db.ui.pageByGroup)pageByGroup={...db.ui.pageByGroup};
 if(db.ui&&PAGE_GROUP[db.ui.currentTab]){page=db.ui.currentTab;cur=db.ui.currentGroup==PAGE_GROUP[page]?db.ui.currentGroup:PAGE_GROUP[page];pageByGroup[cur]=page}
 else if(db.ui&&NAV.some(n=>n.id==db.ui.currentGroup)){cur=db.ui.currentGroup;page=pageByGroup[cur]||NAV.find(n=>n.id==cur).pages[0][0]}
 render()
}
addEventListener("pagehide",()=>{if(!db)return;try{const snapshot=JSON.stringify(db);if(storageDb){const tx=storageDb.transaction("app","readwrite");tx.objectStore("app").put({savedAt:Date.now(),data:snapshot},KEY)}else localStorage.setItem(KEY,snapshot)}catch(e){storageStatus("Save failed — export a backup",true);console.error("Final local save failed",e)}});
startApp();
let installPrompt=null;
const installAppBtn=document.getElementById("installAppBtn");
addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event;installAppBtn.hidden=false});
installAppBtn.addEventListener("click",async()=>{if(!installPrompt)return;try{await installPrompt.prompt()}catch(error){console.error("App installation prompt failed",error)}finally{installPrompt=null;installAppBtn.hidden=true}});
addEventListener("appinstalled",()=>{installPrompt=null;installAppBtn.hidden=true});
if(window.isSecureContext&&"serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js").catch(error=>console.error("Service worker registration failed",error));
</script></body></html>
